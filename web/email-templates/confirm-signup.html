<div style="margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f3f4f6;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f4f6;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(124,58,237,0.12);">
          <tr>
            <td style="padding:28px 28px 8px;text-align:left;">
              <p style="margin:0;font-size:20px;font-weight:700;color:#7c3aed;letter-spacing:-0.02em;">Gymly</p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 8px;">
              <h1 style="margin:0;font-size:22px;font-weight:700;color:#111827;line-height:1.3;">Bekræft din email</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 16px;">
              <p style="margin:0;font-size:16px;line-height:1.6;color:#4b5563;">
                Du er ved at oprette en konto hos <strong style="color:#111827;">Gymly</strong>.
                Tryk på knappen for at bekræfte denne adresse:
              </p>
              <p style="margin:16px 0 0;font-size:15px;line-height:1.5;color:#6b7280;">
                {{ .Email }}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 28px 28px;">
              <a
                href="{{ .ConfirmationURL }}"
                style="display:inline-block;background:#8B5CF6;color:#ffffff;text-decoration:none;padding:14px 28px;border-radius:12px;font-weight:600;font-size:16px;line-height:1.2;"
                >Bekræft og kom i gang</a
              >
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px;">
              <p style="margin:0;font-size:13px;line-height:1.55;color:#9ca3af;">
                Hvis du ikke har oprettet en konto hos Gymly, kan du ignorere denne mail.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0;font-size:12px;color:#9ca3af;text-align:center;">
          Sendt af Gymly · træn sammen
        </p>
      </td>
    </tr>
  </table>
</div>
