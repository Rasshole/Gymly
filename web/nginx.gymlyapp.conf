# nginx — paste INSIDE your server { } for gymlyapp.com.
# Put these locations BEFORE any broad "location / { try_files ... /index.html; }" SPA fallback
# so /confirm is never rewritten to the homepage.
# Query parameters (?code=) and fragments are preserved by the browser; nginx passes ? to try_files URI.

location = /auth/callback {
  try_files /auth/callback/index.html =404;
}

location = /auth/callback/ {
  try_files /auth/callback/index.html =404;
}

location = /.well-known/apple-app-site-association {
  default_type application/json;
  try_files /.well-known/apple-app-site-association =404;
}

location = /.well-known/assetlinks.json {
  default_type application/json;
  try_files /.well-known/assetlinks.json =404;
}

location = /confirm {
  try_files /confirm/index.html =404;
}

location = /confirm/ {
  try_files /confirm/index.html =404;
}

# Legacy Supabase redirect path (optional)
location = /auth/confirm {
  try_files /auth-confirm/index.html =404;
}

location = /auth/confirm/ {
  try_files /auth-confirm/index.html =404;
}
