<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <title>Join Gymly</title>
  <meta name="description" content="Open Gymly to join with your invite code." />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --gymly-purple: #976fff;
      --gymly-purple-deep: #7b4bff;
      --gymly-gradient: linear-gradient(135deg, #9b73ff 0%, #976fff 40%, #7b4bff 100%);
      --gymly-gradient-hover: linear-gradient(135deg, #a680ff 0%, #9b73ff 45%, #8255ff 100%);
      --text-strong: #0c0c10;
      --text-body: rgba(18, 18, 24, 0.62);
      --text-soft: rgba(18, 18, 24, 0.45);
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, 'Segoe UI', sans-serif;
      --radius-card: clamp(26px, 5vw, 32px);
      --ease-premium: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      font-family: var(--font);
      color: var(--text-strong);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }

    .invite-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(180deg, #fffeff 0%, #f3f1fd 42%, #ece8fb 78%, #e8e4fa 100%);
    }

    .invite-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.65;
    }

    .invite-blob--a {
      width: min(90vw, 520px);
      height: min(90vw, 520px);
      top: -12%;
      right: -18%;
      background: radial-gradient(circle, rgba(151, 111, 255, 0.55) 0%, transparent 72%);
    }

    .invite-blob--b {
      width: min(85vw, 480px);
      height: min(85vw, 480px);
      bottom: -18%;
      left: -22%;
      background: radial-gradient(circle, rgba(184, 148, 255, 0.45) 0%, transparent 72%);
    }

    .invite-shell {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100dvh - 48px);
    }

    .invite-card {
      width: min(100%, 420px);
      padding: clamp(1.75rem, 5vw, 2.25rem);
      border-radius: var(--radius-card);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.7) inset,
        0 24px 48px -20px rgba(80, 40, 160, 0.28);
      text-align: center;
    }

    .invite-logo {
      display: block;
      margin: 0 auto 1.25rem;
      width: 112px;
      height: auto;
    }

    .invite-eyebrow {
      margin: 0 0 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--gymly-purple-deep);
    }

    .invite-title {
      margin: 0 0 0.75rem;
      font-size: clamp(1.625rem, 5vw, 1.875rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .invite-lead {
      margin: 0 auto 1.5rem;
      max-width: 32ch;
      font-size: clamp(0.9375rem, 3.2vw, 1rem);
      line-height: 1.55;
      color: var(--text-body);
    }

    .invite-code {
      display: inline-block;
      margin: 0 0 1.5rem;
      padding: 0.55rem 0.9rem;
      border-radius: 12px;
      background: rgba(151, 111, 255, 0.12);
      color: var(--gymly-purple-deep);
      font-size: 1.0625rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }

    .invite-code[hidden] {
      display: none;
    }

    .invite-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      min-width: min(100%, 240px);
      padding: 0.9rem 1.75rem;
      border: none;
      border-radius: 16px;
      background: var(--gymly-gradient);
      color: #fff;
      font-family: inherit;
      font-size: 1.0625rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.25) inset,
        0 12px 28px -6px rgba(123, 75, 255, 0.45);
      transition:
        transform 0.2s var(--ease-premium),
        box-shadow 0.2s var(--ease-premium),
        background 0.2s var(--ease-premium);
    }

    .invite-btn:hover {
      background: var(--gymly-gradient-hover);
    }

    .invite-btn:active {
      transform: scale(0.98);
    }

    .invite-btn:focus-visible {
      outline: 2px solid var(--gymly-purple);
      outline-offset: 3px;
    }

    .invite-hint {
      margin: 1.15rem 0 0;
      font-size: 0.8125rem;
      line-height: 1.45;
      color: var(--text-soft);
    }

    .invite-stores {
      margin-top: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .invite-store {
      font-size: 0.8125rem;
      color: var(--gymly-purple-deep);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
  <script>
    (function () {
      function normalizeCode(raw) {
        if (!raw) return null;
        var n = String(raw).replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        return n.length >= 4 ? n : null;
      }

      function codeFromPath() {
        var match = window.location.pathname.match(/\/invite\/([A-Za-z0-9_-]+)/i);
        return match ? normalizeCode(match[1]) : null;
      }

      document.addEventListener('DOMContentLoaded', function () {
        var code = codeFromPath();
        var codeEl = document.getElementById('invite-code');
        var leadEl = document.getElementById('invite-lead');
        var btn = document.getElementById('open-app');
        var deepLink = code ? 'gymly://invite/' + code : 'gymly://';

        if (code && codeEl) {
          codeEl.textContent = code;
          codeEl.hidden = false;
        }
        if (!code && leadEl) {
          leadEl.textContent =
            'Open Gymly to continue. Ask your friend for their invite link if you do not have a code.';
        }
        if (btn) {
          btn.setAttribute('href', deepLink);
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = deepLink;
          });
        }
      });
    })();
  </script>
</head>
<body>
  <div class="invite-canvas" aria-hidden="true">
    <div class="invite-blob invite-blob--a"></div>
    <div class="invite-blob invite-blob--b"></div>
  </div>

  <main class="invite-shell">
    <article class="invite-card">
      <img
        class="invite-logo"
        src="/assets/logo.png"
        alt="Gymly"
        width="112"
        height="44"
        decoding="async"
      />
      <p class="invite-eyebrow">You're invited</p>
      <h1 class="invite-title">Join Gymly</h1>
      <p class="invite-lead" id="invite-lead">
        Open the app to claim your invite and start training with friends.
      </p>
      <p class="invite-code" id="invite-code" hidden aria-label="Invite code"></p>
      <a id="open-app" class="invite-btn" href="gymly://">Open Gymly</a>
      <p class="invite-hint">Use the Gymly app on your phone. New here? Get the app first.</p>
      <div class="invite-stores">
        <a
          class="invite-store"
          href="https://apps.apple.com/dk/app/gymly-staerkere-sammen/id6757790972"
          rel="noopener noreferrer"
          >App Store</a
        >
        <!-- Google Play public listing for com.gymly not verified yet (404). Do not invent a URL. -->
      </div>
    </article>
  </main>
</body>
</html>
