# nginx — indsæt i server { } for gymlyapp.com FØR location / med SPA fallback.

location = /confirm {
  try_files /confirm/index.html =404;
}

location = /confirm/ {
  try_files /confirm/index.html =404;
}

location = /auth/confirm {
  try_files /auth-confirm/index.html =404;
}

location = /auth/confirm/ {
  try_files /auth-confirm/index.html =404;
}

location = /reset-password {
  try_files /reset-password/index.html =404;
}

location = /reset-password/ {
  try_files /reset-password/index.html =404;
}
