<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Gymly | Nyt kodeord</title>
  <style>
    :root {
      --purple: #8b5cf6;
      --purple-dark: #7c3aed;
      --text: #111827;
      --muted: #6b7280;
      --bg: #f3f4f6;
      --card: #ffffff;
      --border: #e5e7eb;
      --ok: #059669;
      --err: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }
    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }
    .status {
      font-size: 14px;
      border-radius: 12px;
      padding: 10px 12px;
      margin: 0 0 14px;
      display: none;
    }
    .status.show { display: block; }
    .status.loading { background: #ede9fe; color: #5b21b6; }
    .status.error { background: #fef2f2; color: var(--err); }
    .status.success { background: #ecfdf5; color: var(--ok); }
    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }
    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    button {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--purple), var(--purple-dark));
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .links {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .link-btn {
      color: var(--purple-dark);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .success-wrap { display: none; }
    .success-wrap.show { display: block; }
    .form-wrap.hide { display: none; }
    .session-wrap { display: none; margin-top: 8px; }
    .session-wrap.show { display: block; }
    .feedback {
      margin-top: 6px;
      font-size: 13px;
    }
    .feedback.ok { color: var(--ok); }
    .feedback.err { color: var(--err); }
    .feedback.muted { color: var(--muted); }
    .secondary-btn {
      margin-top: 10px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      padding: 11px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Nyt kodeord</h1>
    <p class="subtitle">Indtast nyt kodeord og bekræft for at opdatere din konto.</p>

    <div id="status" class="status loading show">Kontrollerer reset-link...</div>

    <section id="form-wrap" class="form-wrap">
      <label for="password">Nyt kodeord</label>
      <input id="password" type="password" autocomplete="new-password" />
      <div id="len-feedback" class="feedback muted">Minimum 8 tegn.</div>

      <label for="password-confirm">Gentag kodeord</label>
      <input id="password-confirm" type="password" autocomplete="new-password" />
      <div id="match-feedback" class="feedback muted">Skriv begge felter for validering.</div>

      <button id="save-btn" type="button">Opdater kodeord</button>
    </section>

    <section id="success-wrap" class="success-wrap">
      <div class="status success show">Kodeord opdateret</div>
      <p class="subtitle" style="margin-top: 8px;">Du bliver sendt tilbage til appen...</p>
      <div class="links">
        <a id="open-app-link" class="link-btn" href="gymlyapp://home">Åbn app</a>
        <a class="link-btn" href="https://gymly.dk/download">Hent app</a>
      </div>
    </section>

    <section id="session-wrap" class="session-wrap">
      <button id="send-new-link-btn" class="secondary-btn" type="button">Send nyt link</button>
    </section>
  </main>

  <script type="module">
    const SUPABASE_URL = 'https://ykantlsuszpauddasqvz.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrYW50bHN1c3pwYXVkZGFzcXZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NzI4MzEsImV4cCI6MjA4ODQ0ODgzMX0.vungVzubJCR68aSSusjtmoGNQgLaIOkdQN8ipo9bt-I';

    const statusEl = document.getElementById('status');
    const formWrap = document.getElementById('form-wrap');
    const successWrap = document.getElementById('success-wrap');
    const sessionWrap = document.getElementById('session-wrap');
    const saveBtn = document.getElementById('save-btn');
    const sendNewLinkBtn = document.getElementById('send-new-link-btn');
    const passwordEl = document.getElementById('password');
    const confirmEl = document.getElementById('password-confirm');
    const lenFeedbackEl = document.getElementById('len-feedback');
    const matchFeedbackEl = document.getElementById('match-feedback');
    const openAppLinkEl = document.getElementById('open-app-link');

    let supabase;
    let recoveryEmail = '';

    function setStatus(kind, text) {
      statusEl.className = `status ${kind} show`;
      statusEl.textContent = text;
    }

    function clearStatus() {
      statusEl.className = 'status';
      statusEl.textContent = '';
    }

    function setFeedback(el, kind, text) {
      el.className = `feedback ${kind}`;
      el.textContent = text;
    }

    function validateInputs() {
      const password = passwordEl.value.trim();
      const confirm = confirmEl.value.trim();
      const lenOk = password.length >= 8;
      const matchOk = confirm.length > 0 && password === confirm;
      setFeedback(
        lenFeedbackEl,
        lenOk ? 'ok' : 'err',
        lenOk ? 'Minimum 8 tegn opfyldt' : 'Kodeordet skal være mindst 8 tegn',
      );
      if (!confirm.length) {
        setFeedback(matchFeedbackEl, 'muted', 'Skriv begge felter for validering.');
      } else if (!matchOk) {
        setFeedback(matchFeedbackEl, 'err', 'Kodeordene matcher ikke.');
      } else {
        setFeedback(matchFeedbackEl, 'ok', 'Kodeordene matcher.');
      }
      saveBtn.disabled = !lenOk || !matchOk;
    }

    async function establishRecoverySession() {
      const u = new URL(window.location.href);
      const code = u.searchParams.get('code');
      const hash = u.hash.replace(/^#/, '');
      const hp = new URLSearchParams(hash);
      const at = hp.get('access_token');
      const rt = hp.get('refresh_token');
      const type = hp.get('type') || u.searchParams.get('type');

      if (code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) throw new Error('invalid-link');
      } else if (at && rt && type === 'recovery') {
        const { error } = await supabase.auth.setSession({
          access_token: at,
          refresh_token: rt,
        });
        if (error) throw new Error('invalid-link');
      }

      const { data } = await supabase.auth.getSession();
      if (!data?.session) throw new Error('invalid-link');
      recoveryEmail = data.session.user?.email || '';

      // Clean URL from sensitive params/tokens.
      u.searchParams.delete('code');
      u.searchParams.delete('type');
      u.hash = '';
      const qs = u.searchParams.toString();
      history.replaceState(null, '', u.pathname + (qs ? `?${qs}` : ''));
    }

    async function init() {
      try {
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.49.1');
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            flowType: 'pkce',
            detectSessionInUrl: true,
            persistSession: true,
            storage: localStorage,
            autoRefreshToken: true,
          },
        });
        await establishRecoverySession();
        clearStatus();
        sessionWrap.classList.remove('show');
        validateInputs();
      } catch {
        setStatus('error', 'Linket er udløbet.');
        formWrap.classList.add('hide');
        sessionWrap.classList.add('show');
      }
    }

    async function sendNewLink() {
      if (!recoveryEmail) {
        setStatus('error', 'Kunne ikke finde email. Bed om nyt link fra appen.');
        return;
      }
      sendNewLinkBtn.disabled = true;
      setStatus('loading', 'Sender nyt link...');
      try {
        const { error } = await supabase.auth.resetPasswordForEmail(recoveryEmail, {
          redirectTo: window.location.origin + '/reset-password',
        });
        if (error) throw error;
        setStatus('success', 'Nyt link er sendt til din email.');
      } catch {
        setStatus('error', 'Kunne ikke sende nyt link. Prøv igen.');
      } finally {
        sendNewLinkBtn.disabled = false;
      }
    }

    function redirectToAppWithFallback() {
      let hidden = false;
      const onHidden = () => {
        hidden = true;
      };
      document.addEventListener('visibilitychange', onHidden, { once: true });
      openAppLinkEl.setAttribute('href', 'gymlyapp://home');
      window.location.href = 'gymlyapp://home';
      setTimeout(() => {
        if (!hidden && !document.hidden) {
          window.location.href = 'https://gymly.dk/download';
        }
      }, 1800);
    }

    passwordEl.addEventListener('input', validateInputs);
    confirmEl.addEventListener('input', validateInputs);
    sendNewLinkBtn.addEventListener('click', sendNewLink);

    saveBtn.addEventListener('click', async () => {
      const password = passwordEl.value.trim();
      const confirm = confirmEl.value.trim();

      if (password.length < 8) {
        setStatus('error', 'Kodeordet skal være mindst 8 tegn.');
        return;
      }
      if (password !== confirm) {
        setStatus('error', 'Kodeordene matcher ikke.');
        return;
      }

      saveBtn.disabled = true;
      setStatus('loading', 'Gemmer nyt kodeord...');
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        const { data } = await supabase.auth.getSession();
        if (!data?.session) throw new Error('session-missing');
        clearStatus();
        formWrap.classList.add('hide');
        successWrap.classList.add('show');
        setTimeout(() => {
          redirectToAppWithFallback();
        }, 1000);
      } catch {
        setStatus('error', 'Kunne ikke gemme nyt kodeord. Prøv igen.');
      } finally {
        saveBtn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
