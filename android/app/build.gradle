apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-config: map flavors to production `.env`.
// Also refuse Release if a shell ENVFILE points at QA (dotenv.gradle prefers System.env).
project.ext.envConfigFiles = [
    debug: ".env",
    release: ".env",
]
project.ext.defaultEnvFile = ".env"

def _gradleTasks = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def _isAndroidRelease = _gradleTasks.any { it.contains('release') }
def _envfile = System.getenv('ENVFILE')
if (_isAndroidRelease && _envfile != null && _envfile.toLowerCase().contains('qa')) {
    throw new GradleException(
        "Android Release refused: ENVFILE=${_envfile}. Unset ENVFILE so production `.env` is used."
    )
}

// Inject root `.env` into BuildConfig / resources (react-native-config).
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Release must use the real upload keystore. Never fall back to the debug key.
if (_isAndroidRelease) {
    def releaseSigningProblems = []
    if (!keystorePropertiesFile.exists()) {
        releaseSigningProblems << "android/keystore.properties is missing (copy android/keystore.properties.example and fill in the real values)"
    } else {
        ["storeFile", "storePassword", "keyAlias", "keyPassword"].each { key ->
            def value = keystoreProperties.getProperty(key)
            if (value == null || value.trim().isEmpty() || value.trim() == "REPLACE") {
                releaseSigningProblems << "keystore.properties ${key} is missing"
            }
        }
        def storePath = keystoreProperties.getProperty("storeFile")
        if (storePath != null && !storePath.trim().isEmpty() && storePath.trim() != "REPLACE") {
            def store = file(storePath.trim())
            if (!store.isFile()) {
                releaseSigningProblems << "release keystore file was not found at ${storePath.trim()}"
            }
        }
    }
    if (!releaseSigningProblems.isEmpty()) {
        throw new GradleException(
            "Android Release refused: release signing is not configured. A release build must not be signed with the debug key. " +
            releaseSigningProblems.join("; ")
        )
    }
}

def googleMapsApiKey = localProperties.getProperty("GOOGLE_MAPS_API_KEY", "")

react {
    root = file("${projectRoot}/")
    reactNativeDir = file("${projectRoot}/node_modules/react-native")
    codegenDir = file("${projectRoot}/node_modules/@react-native/codegen")
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = "org.webkit:android-jsc:+"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.gymly.app"

    defaultConfig {
        applicationId "com.gymly"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 55
        versionName "2.1.2"
        // applicationId (com.gymly) differs from namespace/BuildConfig (com.gymly.app).
        // react-native-config needs this to locate BuildConfig at runtime.
        resValue "string", "build_config_package", "com.gymly.app"
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: googleMapsApiKey,
        ]
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // AGP 8.5.1+: store uncompressed JNI libs with 16 KB zip alignment (Play requirement).
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation("com.google.android.material:material:1.12.0")
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: "com.google.gms.google-services"
